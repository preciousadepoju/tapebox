# Hosted shared sandbox: anvil fork (private) + RPC proxy (public, blocks cheat methods).
#   cp .env.example .env   # set ADMIN_TOKEN, DOMAIN, STATE_URL
#   ./fetch-state.sh       # pull the published snapshot into ../state (else anvil backfills from public RPC)
#   docker compose up -d
services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      FORK_URL: ${FORK_URL:-https://rpc.xlayer.tech}
      FORK_BLOCK: ${FORK_BLOCK:-77014830}
    volumes:
      - ./anvil/entrypoint.sh:/entrypoint.sh:ro
      - ../state:/state:ro
    restart: unless-stopped
    # no published ports: only reachable from the proxy

  proxy:
    build: ./proxy
    environment:
      UPSTREAM: http://anvil:8545
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in infra/.env}
      RATE_PER_MIN: ${RATE_PER_MIN:-600}
    ports:
      - "${PROXY_PORT:-8080}:8080"
    depends_on:
      - anvil
    restart: unless-stopped

  # TLS in front of the proxy. Set DOMAIN in .env and point DNS at the server.
  caddy:
    image: caddy:2-alpine
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to proxy:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - proxy
    restart: unless-stopped

volumes:
  caddy_data:
