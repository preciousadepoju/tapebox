name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Dogfood the CLI end to end in mock mode (no fork needed in CI).
      - name: tapebox test (mock)
        working-directory: packages/cli
        run: |
          pnpm exec tsx src/index.ts test --mock --config tapebox.config.example.ts --junit results.xml
          pnpm exec tsx src/index.ts test --mock --config tapebox.config.builder.example.ts

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tapebox-results
          path: packages/cli/results.xml
          if-no-files-found: ignore
